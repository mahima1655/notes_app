<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #faf8f5;
            margin: 0;
            padding: 15px;
            line-height: 1.4;
        }
        .main {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            border: 2px solid #ddd;
            padding: 25px;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .login-area {
            text-align: center;
            padding: 40px 20px;
        }
        .login-area p {
            margin-bottom: 25px;
            color: #666;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background: #357abd;
        }
        .logout-btn {
            background: #d9534f;
            float: right;
            margin-bottom: 20px;
        }
        .logout-btn:hover {
            background: #c9302c;
        }
        .user-info {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .user-info h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }
        .new-note {
            margin-bottom: 30px;
        }
        .new-note textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: Georgia, serif;
            font-size: 14px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .new-note textarea:focus {
            outline: none;
            border-color: #4a90e2;
        }
        .note {
            border-left: 4px solid #4a90e2;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        .note-content {
            margin-bottom: 10px;
            white-space: pre-wrap;
        }
        .note-meta {
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .delete-btn {
            background: #d9534f;
            font-size: 12px;
            padding: 4px 8px;
            float: right;
        }
        .no-notes {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 30px;
        }
        .clear {
            clear: both;
        }
    </style>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
</head>
<body>
    <div class="main">
        <div id="login-section">
            <h1>My Notes</h1>
            <div class="login-area">
                <p>Please sign in to access your notes</p>
                <button id="login-btn">Login</button>
            </div>
        </div>
        
        <div id="user-section" style="display: none;">
            <h1>My Notes</h1>
            <button id="logout-btn" class="logout-btn">Logout</button>
            <div class="clear"></div>
            
            <div class="user-info">
                <div id="user-info"></div>
            </div>
            
            <div class="new-note">
                <textarea id="note-input" placeholder="Write something..."></textarea>
                <button id="add-note-btn">Add Note</button>
            </div>
            
            <div id="notes-list"></div>
        </div>
    </div>

    <script>
        let auth0Client = null;
        let currentUser = null;

        // Configure Auth0 - Replace with your Auth0 domain and client ID
        const configureClient = async () => {
            auth0Client = await auth0.createAuth0Client({
                domain: 'dev-pzsqrlx8rchlpg1a.us.auth0.com',
                clientId: 'iuVarf8MVEnwZqsranKBCf7Y03o9wfB3',
                authorizationParams: {
                    redirect_uri: window.location.origin
                }
            });
        };

        // Check if user is authenticated
        const updateUI = async () => {
            const isAuthenticated = await auth0Client.isAuthenticated();
            
            document.getElementById('login-section').style.display = 
                isAuthenticated ? 'none' : 'block';
            document.getElementById('user-section').style.display = 
                isAuthenticated ? 'block' : 'none';

            if (isAuthenticated) {
                currentUser = await auth0Client.getUser();
                document.getElementById('user-info').innerHTML = `
                    <h2>Welcome back, ${currentUser.name.split(' ')[0]}</h2>
                `;
                loadNotes();
            }
        };

        // Login function
        const login = async () => {
            await auth0Client.loginWithRedirect();
        };

        // Logout function
        const logout = () => {
            auth0Client.logout({
                logoutParams: {
                    returnTo: window.location.origin
                }
            });
        };

        // Initialize the app
        window.onload = async () => {
            await configureClient();

            // Handle redirect callback
            if (location.search.includes('code=') && location.search.includes('state=')) {
                await auth0Client.handleRedirectCallback();
                window.history.replaceState({}, document.title, '/');
            }

            await updateUI();

            // Event listeners
            document.getElementById('login-btn').addEventListener('click', login);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('add-note-btn').addEventListener('click', addNote);
        };

        // Notes functionality
        const getStorageKey = () => `notes_${currentUser.sub}`;

        const loadNotes = () => {
            const notes = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            displayNotes(notes);
        };

        const displayNotes = (notes) => {
            const notesList = document.getElementById('notes-list');
            if (notes.length === 0) {
                notesList.innerHTML = '<div class="no-notes">No notes yet. Write your first one above!</div>';
            } else {
                notesList.innerHTML = notes.map((note, index) => `
                    <div class="note">
                        <div class="note-content">${note.text}</div>
                        <div class="note-meta">
                            ${new Date(note.timestamp).toLocaleString()}
                            <button onclick="deleteNote(${index})" class="delete-btn">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
        };

        const addNote = () => {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if (!text) return;

            const notes = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            notes.unshift({ text, timestamp: Date.now() });
            localStorage.setItem(getStorageKey(), JSON.stringify(notes));
            
            input.value = '';
            displayNotes(notes);
        };



        const deleteNote = (index) => {
            const notes = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            notes.splice(index, 1);
            localStorage.setItem(getStorageKey(), JSON.stringify(notes));
            displayNotes(notes);
        };
    </script>
</body>
</html>
